name: Instalador Web Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-installer.yml']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:web
      - name: Publicar instalador e pacote da mesma versão
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $files = @(Get-ChildItem release/nsis-web -File | Where-Object { $_.Extension -in '.exe', '.7z' } | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw 'Instalador ou pacote ausente' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Versão já publicada. Aumente a versão para preservar os downloads existentes.' }
          gh release create $tag --target $env:GITHUB_SHA --draft --prerelease --title "Sala $version — instalador web" --notes "Instalador pequeno para Windows x64. Baixa o pacote durante a instalação. Versão experimental sem assinatura digital; pode ser bloqueada pelo Windows."
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar release' }
          gh release upload $tag @files
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar arquivos' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
      - name: Testar download público e instalação web
        shell: pwsh
        run: |
          $config = Get-Content package.json | ConvertFrom-Json
          $version = $config.version
          $dir = Join-Path $env:RUNNER_TEMP 'sala-web-test'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $installer = Join-Path $dir 'Sala-Web-Setup.exe'
          $url = "$($config.build.publish.url)Sala-Web-Setup-$version.exe"
          Invoke-WebRequest $url -OutFile $installer
          $expected = (Get-FileHash "release/nsis-web/Sala-Web-Setup-$version.exe" -Algorithm SHA256).Hash
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Instalador baixado difere do build' }
          $destination = Join-Path $dir 'installed'
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -PassThru
          if (!$process.WaitForExit(240000)) { $process.Kill(); throw 'Instalação excedeu 4 minutos' }
          if ($process.ExitCode -ne 0) { throw "Instalação falhou: $($process.ExitCode)" }
          if (!(Test-Path "$destination/Sala.exe")) { throw 'Sala.exe não foi instalado' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$destination/Sala.exe")
          if (!$icon) { throw 'Executável sem ícone' }
          $bitmap = $icon.ToBitmap()
          $lime = 0
          for ($x = 0; $x -lt $bitmap.Width; $x++) {
            for ($y = 0; $y -lt $bitmap.Height; $y++) {
              $pixel = $bitmap.GetPixel($x, $y)
              if ($pixel.R -gt 170 -and $pixel.G -gt 220 -and $pixel.B -lt 140) { $lime++ }
            }
          }
          if ($lime -lt ($bitmap.Width * $bitmap.Height * 0.2)) { throw 'Ícone do Sala não foi gravado no executável' }
          $bitmap.Dispose()
          $icon.Dispose()
          if ((Get-Item "$destination/Sala.exe").VersionInfo.ProductName -ne 'Sala') { throw 'Nome do produto incorreto' }
          'Download, instalação web, nome do produto e ícone do Sala: OK'
      - uses: actions/upload-artifact@v4
        with:
          name: Sala-Web-Windows
          path: desktop/release/nsis-web/Sala-Web-Setup-*.exe
          if-no-files-found: error
